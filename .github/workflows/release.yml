name: Release binaries

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  linux:
    name: Linux static (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5

      - name: Build static oi + oix inside alpine container
        # Mirrors Dockerfile.oi (as generated by `oi registry docker`).
        # [ocaml-option-static] configures the ocaml switch to emit fully
        # static binaries; no ld flag fiddling required.
        run: |
          cat > Dockerfile.build <<'EOF'
          FROM ocaml/opam:alpine-3.22-ocaml-5.4 AS builder
          USER root
          RUN apk add --no-cache build-base m4 perl pkgconf git curl bash patch \
              gmp-dev gmp-static sqlite-dev sqlite-static openssl-dev openssl-libs-static \
              zlib-dev zlib-static
          USER opam
          WORKDIR /home/opam/src
          COPY --chown=opam:opam . /home/opam/src
          ENV OPAMYES=true OPAMCONFIRMLEVEL=unsafe-yes OI_STATIC=1
          RUN cd ~/opam-repository && git pull --quiet origin master \
              && opam-2.5 update default
          RUN opam-2.5 repo add avsm git+https://git.recoil.org/anil.recoil.org/opam-overlay --all && opam-2.5 update
          RUN opam-2.5 switch create . --deps-only --repos avsm,default \
              --packages "ocaml-option-static,ocaml-option-no-compression,ocaml.5.4.1"
          RUN opam-2.5 exec -- dune build --profile=release bin/main.exe bin/oix.exe
          USER root
          RUN install -m 0755 _build/default/bin/main.exe /oi \
              && install -m 0755 _build/default/bin/oix.exe /oix
          FROM scratch
          COPY --from=builder /oi /oi
          COPY --from=builder /oix /oix
          EOF
          mkdir -p dist
          docker buildx build \
            -f Dockerfile.build \
            --output type=local,dest=./bin-out \
            .
          install -m 0755 bin-out/oi dist/oi-linux-${{ matrix.arch }}
          install -m 0755 bin-out/oix dist/oix-linux-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.arch }}
          path: |
            dist/oi-linux-${{ matrix.arch }}
            dist/oix-linux-${{ matrix.arch }}
          if-no-files-found: error

  macos:
    name: macOS release (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.1"

      - name: Build release oi + oix
        run: |
          opam repo add avsm git+https://git.recoil.org/anil.recoil.org/opam-overlay --all && opam update
          opam install -y --deps-only .
          opam exec -- dune build --profile=release bin/main.exe bin/oix.exe
          mkdir -p dist
          install -m 0755 _build/default/bin/main.exe dist/oi-macos-arm64
          install -m 0755 _build/default/bin/oix.exe dist/oix-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-macos-arm64
          path: |
            dist/oi-macos-arm64
            dist/oix-macos-arm64
          if-no-files-found: error

  release-upload:
    name: Attach binaries to release
    needs: [linux, macos]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/oi-linux-x86_64 \
            dist/oi-linux-aarch64 \
            dist/oi-macos-arm64 \
            dist/oix-linux-x86_64 \
            dist/oix-linux-aarch64 \
            dist/oix-macos-arm64 \
            --clobber
