name: Build registry

# Manual-only for now. Invoke from the Actions tab → "Run workflow".
# Each job independently rsyncs its own <os_key>/ subtree into the target,
# so partial failures don't poison the registry.
on:
  workflow_dispatch:

# Configuration lives in repo vars + secrets:
#   vars.REGISTRY_RSYNC_DEST  user@host:/absolute/path (e.g. avsm@oi.ci.dev:/srv/registry)
#   secrets.REGISTRY_SSH_KEY  private key authorised for the rsync user
#
# The workflow derives the destination host by taking the part before the
# colon in REGISTRY_RSYNC_DEST (with any trailing user@ stripped) and
# `ssh-keyscan`s it at runtime.

env:
  # Where each job stages its output before rsyncing. Directly mirrors the
  # layout the registry serves: <os_key>/OINDEX.txt, <os_key>/<hash>.tar.zst,
  # <os_key>/index.db, plus the one-shot oi-linux-<arch> binary on Linux.
  REGISTRY_LOCAL: ${{ github.workspace }}/registry

jobs:
  # ---------------------------------------------------------------------------
  # Linux aarch64 — drives the full multi-distro docker compose project
  # generated by `oi docker --all`. Produces os_keys like alpine~3.23~arm64,
  # debian~13~arm64, ubuntu~{22.04,24.04,25.10}~arm64, fedora~43~arm64.
  #
  # Note: x86_64 Linux is intentionally *not* built here — registry consumers
  # on Intel Linux fall back to source builds. Re-enable the [linux-amd64]
  # job below if the x86_64 binary cache becomes worth the runner minutes.
  # ---------------------------------------------------------------------------
  linux-arm64:
    name: Linux (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Restore oi/dune cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache
            ~/.cache/oi
            ~/.local/share/oi
          key: oi-registry-linux-arm64-${{ github.sha }}
          restore-keys: |
            oi-registry-linux-arm64-

      - name: Install oi from latest release
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/oi" \
            "https://github.com/${{ github.repository }}/releases/latest/download/oi-linux-$(uname -m)"
          chmod +x "$HOME/.local/bin/oi"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bootstrap reporepo
        run: oi repo list

      - name: Generate Dockerfiles + compose
        # --refresh forces the depext computation to pull a fresh
        # reporepo + base overlays before solving each overlay's
        # x-root-packages — silent solve failures here would otherwise
        # leave the generated install line short of the depexts the
        # in-container build needs.
        run: |
          oi docker --all --refresh -o "$GITHUB_WORKSPACE"

      - name: docker compose up --build
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$REGISTRY_LOCAL"
          docker compose up --build --abort-on-container-exit
          find "$REGISTRY_LOCAL" -type f

      - name: Rsync to ${{ vars.REGISTRY_RSYNC_DEST }}
        if: vars.REGISTRY_RSYNC_DEST != ''
        env:
          REGISTRY_SSH_KEY: ${{ secrets.REGISTRY_SSH_KEY }}
          REGISTRY_RSYNC_DEST: ${{ vars.REGISTRY_RSYNC_DEST }}
        run: |
          bash ./.github/scripts/rsync-registry.sh

  macos:
    name: macOS ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Restore oi cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/oi
            ~/.local/share/oi
            ~/Library/Caches/oi
          key: oi-registry-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            oi-registry-${{ matrix.os }}-

      - name: Install oi from latest release
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/oi" \
            "https://github.com/${{ github.repository }}/releases/latest/download/oi-macos-arm64"
          chmod +x "$HOME/.local/bin/oi"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bootstrap reporepo
        run: oi repo list

      - name: Install Homebrew depexts
        # `oi build --all --depext` solves every overlay's x-root-packages
        # under the host platform and prints the resulting package list,
        # mirroring what `oi docker --all` bakes into Linux Dockerfiles.
        # autoconf is appended unconditionally because the oxcaml
        # toolchain's autogen.sh requires it and it isn't pulled in by
        # any opam depext.
        run: |
          deps=$(oi build --refresh --all --depext)
          echo "Homebrew depexts:"
          printf '  %s\n' $deps autoconf
          brew install autoconf $deps

      - name: Build + export the registry
        run: |
          mkdir -p "$REGISTRY_LOCAL"
          oi build --refresh --all --export "$REGISTRY_LOCAL"
          find "$REGISTRY_LOCAL" -type f

      - name: Rsync to ${{ vars.REGISTRY_RSYNC_DEST }}
        if: vars.REGISTRY_RSYNC_DEST != ''
        env:
          REGISTRY_SSH_KEY: ${{ secrets.REGISTRY_SSH_KEY }}
          REGISTRY_RSYNC_DEST: ${{ vars.REGISTRY_RSYNC_DEST }}
        run: |
          bash ./.github/scripts/rsync-registry.sh
